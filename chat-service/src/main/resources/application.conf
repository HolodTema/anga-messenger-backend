ktor {
    deployment {
        port = 8081
        host = "0.0.0.0"
    }
    application {
        modules = { com.terabyte.angamessenger.chat.ApplicationKt.module }
    }
}

jwt {
    secret = ${?JWT_SECRET}
}

database {
    url = ${?DB_URL}
    driver = "org.postgresql.Driver"
    user = ${?DB_USER}
    password = ${?DB_PASSWORD}
}
